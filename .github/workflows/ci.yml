name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean build and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check proof sources
        run: python scripts/check_proof_hygiene.py
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Audit selected declarations
        shell: bash
        run: |
          set -euo pipefail
          lake env lean scripts/Axioms.lean | tee axiom-audit.log
          python scripts/check_proof_hygiene.py --axiom-log axiom-audit.log

  computations:
    name: Bounded computational checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.96.0'
          components: rustfmt
      - name: Python finite checks
        run: |
          python -B -m unittest discover -s compute -p 'test_*.py' -v
          python -B compute/type_i_switch_check.py
          python -B compute/smoothing_check.py
      - name: Rust formatting and tests
        run: |
          cargo fmt --manifest-path compute/twinsieve/Cargo.toml --check
          cargo fmt --manifest-path compute/parity/Cargo.toml --check
          cargo test --locked --offline --manifest-path compute/twinsieve/Cargo.toml
          cargo test --locked --offline --manifest-path compute/parity/Cargo.toml
